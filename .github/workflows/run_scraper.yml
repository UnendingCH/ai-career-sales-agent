name: 24/7 AI Job & Social Lead Hunter

on:
  schedule:
    # Runs automatically every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Adds a manual "Run workflow" button so you can test anytime!

jobs:
  hunt-jobs-and-leads:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Job & Social Signal Scraper
        env:
          APPS_SCRIPT_WEBHOOK_URL: ${{ secrets.APPS_SCRIPT_WEBHOOK_URL }}
        run: python scraper.py
